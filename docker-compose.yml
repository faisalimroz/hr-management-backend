version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: hrms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: hrms_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: hrms_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: "HR Management Platform API"
      APP_ENV: "production"
      DEBUG: "false"
      API_V1_STR: "/api/v1"
      SECRET_KEY: "change_this_to_a_secure_random_hex_string_in_production"
      ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
      DATABASE_URL: "postgresql://postgres:postgrespassword@db:5432/hrms_db"
      CORS_ORIGINS: "*"
    ports:
      - "8000:8000"

volumes:
  postgres_data:
